# ----------------------------------------------------------------------------------------------------------------
# Organization profile  (EXAMPLE: copy to profile.ini and fill it in; profile.ini is private and never published)
#
# Fill it in once. Lines that start with # are notes. Leave a value blank if you do not know it: the assessor then
# says "unknown" instead of guessing. This tool is built for very small businesses (1 to about 15 users).
# Everything here is YOUR statement of fact. The tool does not decide which rules apply to you.
# ----------------------------------------------------------------------------------------------------------------

[organization]
name =                              ; optional; never sent to the AI
employees = 3                       ; PRIVATE. Employees: the count the article's size categories use. Never published.
people = 3                          ; PRIVATE. Everyone who uses the company's systems (employees and contractors).
                                    ; Be honest: the assessment is only as true as these numbers. The AI never sees them.
# The size band is worked out by the tool from 'employees', using the categories in the article cited in
# DESIGN-organization-profile.md: nano = fewer than 5 | micro = 5 to 9 | mini = 10 to 19.
# This tool is for under 20 employees; a larger number gets a warning. The AI sees only the band.
owner_is_it_admin = yes             ; does one person both run the business and administer the systems? yes | no
security_lead = owner               ; who answers for security: owner | employee | outside_provider
independent_reviewer = no           ; does anyone other than the administrator review changes or logs? yes | no
outside_it_provider = no            ; does an outside party work ON your systems (remote tunnel or on site)? yes | no
                                    ; (a cloud service that only hosts your data is NOT this: list it under [system.*])

[roles]
# role = who holds it (a title or a first name is fine). Several roles may be held by the same person.
system_owner = owner
administrator = owner
security_officer = owner
approver_of_changes = owner

[business]
# Optional. 'seed_from' points at your capability statement (or similar); the tool can propose these values from it
# and you confirm them. The file stays on this machine; its identifiers are never sent to the AI.
seed_from =                         ; e.g. a Word, Markdown or text file with your capability statement
naics =                             ; industry codes, comma separated
customer_groups =                   ; defense | civilian | commercial | space | other
facility_type = home_office         ; home_office | shared_office | commercial_space | other

[scope]
cui_types =                         ; kinds of controlled information you handle, in your own words
cui_stored_in =                     ; which of the systems below hold or process it (use the system names)
boundary_note =                     ; one or two sentences: what is inside the protected boundary, what is outside

# ---- Contracts -------------------------------------------------------------------------------------------------
# One section per contract or subcontract that brings sensitive information. They decide WHICH revision applies,
# so they decide which checklist is run. Keep contract numbers here only if you want them; they stay on this machine.
# The assessor never shows contract details to the AI: it only learns which revisions to assess against.

[contract.1]
label = Example prime contract      ; any name you will recognise
agency_group = DoW                  ; DoW | GSA | other_civilian
vehicle = prime                     ; prime | subcontract
clauses = DFARS 252.204-7012        ; the clauses that mention CUI or 800-171, as written in the contract
required_revision = 2               ; 2 | 3 | unspecified
revision_basis = contract_text      ; contract_text | agency_notice | assumed   (how you know)
revision_source = Clause text and the current DoW class deviation   ; where it is written
last_verified = 2026-10-06          ; the date you last checked it; the tool warns when this is more than 90 days old
flows_down_to =                     ; subcontractors that receive this information from you (names or none)
flows_down_from =                   ; the prime that gave you this information, if you are a subcontractor

[contract.2]
label = Example civilian agency task order
agency_group = GSA
vehicle = prime
clauses = Agency clause on CUI and 800-171
required_revision = 3
revision_basis = agency_notice
revision_source = Agency notice, date and title
last_verified = 2026-10-06

[contract.3]
label = Example other civilian agency
agency_group = other_civilian
vehicle = subcontract
clauses = 800-171 (version not stated)
required_revision = unspecified     ; the tool assesses against Rev 3 and marks the result "assumed"
revision_basis = assumed
last_verified = 2026-10-06

# ---- Outside parties with hands on your systems --------------------------------------------------------------
# List a provider ONLY if they work on your systems: remote (they tunnel in) or on site. A cloud or software service
# that merely hosts your data is not listed here; describe it as a system below.

[provider.example-it]
name = Example IT Support           ; who they are
access = remote                     ; remote | on_site | both
covers = server1                    ; the systems they work on (names from below)
agreement = Support agreement, with CUI terms   ; where their obligations are written

# ---- Systems ---------------------------------------------------------------------------------------------------
# One section per computer, service or network device that is inside the boundary or touches it.

[system.server1]
kind = server                       ; server | workstation | laptop | mobile | network_device | cloud_service | managed_service
in_boundary = yes                   ; yes | no
operating_system = Linux
administered_by = owner             ; owner | employee | outside_provider | cloud_provider
provider =                          ; if administered_by = outside_provider: the [provider.*] name
ssh_alias =                         ; the SSH name the assessor may use to run read-only checks (blank = not scanned)
notes =

[system.mail-service]
kind = cloud_service
in_boundary = yes
administered_by = cloud_provider
provider_authorization =            ; e.g. the provider's FedRAMP level, if a contract requires one
responsibility_document =           ; where the provider says who does what (shared responsibility)

# ---- How the assessor behaves ---------------------------------------------------------------------------------
[assessment]
targets = server1                   ; systems to scan, by name (the ones with an SSH alias)
not_applicable_needs_reason = yes   ; an objective can be marked N/A only with a reason that points at a fact above
